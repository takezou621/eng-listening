# コンテンツパイプラインの Python 依存 (uv で解決する)。
# 実行: uv run --project tools/content python tools/content/<script>.py ...
# av は faster-whisper 1.x と互換のある 15.x 系に固定 (av 16 で API が変わり落ちるため)。
[project]
name = "eng-listening-content-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2,<3",
  "faster-whisper>=1.1,<2",
  "av>=14,<16",
]

[tool.uv]
package = false
